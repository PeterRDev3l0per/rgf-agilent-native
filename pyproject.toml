[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agilent-native"
version = "0.1.0"
description = "Ultra-lightweight self-hosted visual Kanban, Gantt timeline & local RAG chat suite for AI coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.4.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.scripts]
agilent = "agilent_native.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agilent_native"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
